
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tickets - MovieMagic</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">Movie<span>Magic</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="movies.html">Movies</a></li>
                <li><a href="shows.html">Shows</a></li>
                <li><a href="mybookings.html">My Bookings</a></li>
            </ul>
            <a href="movies.html" class="login-btn">Book Tickets</a>
        </nav>
    </header>

    <section class="movies-section">
        <div class="section-heading">
            <div>
                <p class="small-heading">YOUR MOVIE EXPERIENCE</p>
                <h2>Book Your Tickets</h2>
            </div>
        </div>

        <div class="feature">
            <form id="bookingForm">
                <label>Your Name</label>
                <input type="text" id="customerName" placeholder="Enter your name" required>

                <label>Email Address</label>
                <input type="email" id="customerEmail" placeholder="Enter your email" required>

                <label>Select Number of Seats</label>
                <input type="number" id="seats" min="1" max="10" value="1" required>

                <button type="submit" class="login-btn">Confirm Booking</button>
            </form>

            <p id="bookingMessage"></p>
        </div>
    </section>

    <footer>
        <h2>Movie<span>Magic</span></h2>
        <p>Your perfect movie experience starts here.</p>
        <p>© 2026 MovieMagic. All Rights Reserved.</p>
    </footer>

    <script src="js/booking.js"></script>
</body>
</html>
